<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Ateliers Doublage</title>
<style>
  :root{
    --bg: #1a1a2e;
    --card-bg: #16213e;
    --panel-bg: #0f3460;
    --accent: #e94560;
    --success: #53d769;
    --muted: #aaa;
    --text: #eee;
    --deep: #071226;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .view { display: none; }
  .view.active { display: block; }
  #view-select { display: none; align-items: flex-start; justify-content: center; min-height: 100vh; padding-top: 36px; }
  #view-select.active { display: flex; }
  .card { background: var(--card-bg); border-radius: 16px; padding: 40px; width: 500px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  .card { background: var(--card-bg); border-radius: 16px; padding: 40px; width: 900px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  h1 { font-size: 1.5rem; margin-bottom: 8px; color: var(--accent); }
  .subtitle { color: #888; font-size: .85rem; margin-bottom: 28px; }
  .field { margin-bottom: 20px; }
  label { display: block; font-size: .85rem; color: #aaa; margin-bottom: 6px; }
  .file-input { display: block; width: 100%; padding: 12px 16px; background: var(--panel-bg); border: 2px dashed rgba(255,255,255,0.06); border-radius: 10px; color: var(--text); cursor: pointer; font-size: .9rem; transition: .2s; }
  .file-input:hover { border-color: var(--accent); }
  .file-input.has-file { border-color: var(--success); border-style: solid; }
  .file-name { color: var(--success); font-size: .8rem; margin-top: 4px; }
  .formats { color: #666; font-size: .75rem; margin-top: 2px; }
  .search-input { display: block; width: 100%; padding: 10px 16px; background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px 10px 0 0; color: var(--text); font-size: .9rem; outline: none; transition: border-color .2s; }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: #555; }
  .filters-row { display:flex; gap:12px; flex-wrap:nowrap; align-items:flex-start; overflow-x:auto; white-space:nowrap; }
  .filter-col { display:flex; flex-direction:column; }
  .filter-col label { margin-bottom:6px; }
  .filter-col select { min-width:0; }
  .video-list { display: block; width: 100%; background: rgba(15,52,96,0.92); border: 1px solid rgba(0,0,0,0.25); border-top: none; border-radius: 0 0 10px 10px; color: var(--text); font-size: .9rem; padding: 6px 0; overflow-y: auto; max-height: none; }
  /* reserve scrollbar gutter to avoid layout jumps when scrollbar appears/disappears */
  .video-list { scrollbar-gutter: stable; }
  .video-list option { padding: 6px 16px; cursor: pointer; }
  .video-list option:checked { background: #e94560; color: #fff; }
    .video-row { display:block; padding: 8px 12px; cursor: pointer; }
    .video-row:hover { background: #192847; }
    .video-row.selected { background: #e94560; color: #fff; }
    .video-row .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .video-row .excerpt { width: 110px; text-align: left; color: #aaa; font-size: .9rem; white-space: nowrap; padding-left:6px; }
  .refresh-btn { background: none; border: none; color: #888; font-size: .8rem; cursor: pointer; padding: 0; text-decoration: underline; width: auto; }
  .refresh-btn:hover:not(:disabled) { color: #e94560; background: none; }
  button { width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: .2s; }
  button:hover:not(:disabled) { background: #c81d4e; }
  button:disabled { opacity: .5; cursor: default; }
  .error { display: none; margin-top: 16px; padding: 12px; background: rgba(233,69,96,0.06); border-radius: 8px; color: var(--accent); font-size: .85rem; }
  .error.active { display: block; }
  #view-editor { display: flex; flex-direction: column; min-height: 100vh; max-width: 900px; margin: 0 auto; padding: 0; }
  .editor-top { flex-shrink: 0; padding: 12px 16px 0; }
  .player-wrap { flex-shrink: 0; background: #000; width: 75%; max-width: 1100px; margin: 0 auto 8px; aspect-ratio: 16/9; }
  #editor-video { width: 100%; height: 100%; display: block; background: #000; }
  .player-bar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 6px; }
  .player-tc { font-size: .75rem; color: #666; font-variant-numeric: tabular-nums; }
  .player-hint { font-size: .72rem; color: #555; }
  .editor-body { flex: 1; overflow: hidden; padding: 0 16px 12px; display: flex; flex-direction: column; }
  .table-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .editor-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .editor-header h2 { color: var(--accent); font-size: 1.1rem; flex: 1; }
  .btn-sm { width: auto; padding: 8px 18px; font-size: .88rem; border-radius: 8px; white-space: nowrap; }
  .btn-green { background: #53d769; color: #111; }
  .btn-green:hover:not(:disabled) { background: #47c05d; }
  .btn-outline { background: none; border: 2px solid #e94560; color: #e94560; }
  .btn-outline:hover:not(:disabled) { background: #e94560; color: #fff; }
  .editor-meta { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .editor-meta label { display: inline; color: #aaa; font-size: .85rem; margin-right: 6px; }
  .editor-meta input { background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; color: var(--text); padding: 6px 12px; font-size: .9rem; outline: none; transition: border-color .2s; }
  .editor-meta input:focus { border-color: var(--accent); }
  .save-status { font-size: .8rem; color: #aaa; margin-left: auto; }
  .save-status.ok { color: #53d769; }
  .save-status.err { color: #e94560; }
  .table-wrap { overflow: auto; border-radius: 12px; background: var(--card-bg); flex: 1; min-height: 48vh; position: relative; }
  /* reserve scrollbar gutter on the table area to keep filters stable, but allow columns to flex */
  .table-wrap { scrollbar-gutter: stable both-edges; }
  .table-wrap table { width: 100%; table-layout: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  thead th { background: var(--panel-bg); color: var(--muted); padding: 10px 12px; text-align: left; position: sticky; top: 0; z-index: 1; }
  tbody tr { border-bottom: 1px solid #1e2d4a; cursor: pointer; }
  tbody tr:hover { background: #192847; }
  tbody tr.playing { background: rgba(83,215,105,0.06); outline: 2px solid var(--success); outline-offset: -2px; }
  td { padding: 8px 10px; vertical-align: top; }
  td.col-tc { color: #666; font-size: .75rem; white-space: nowrap; width: 90px; }
  td.col-char { width: 120px; }
  td.col-orig { color: #ccc; max-width: 340px; line-height: 1.4; }
  td.col-detour { width: 340px; }
  /* phoneme gauge (vertical) */
  td.col-gauge { width: 12px; padding: 6px 4px; }
  .phoneme-gauge { width:8px; height:100%; background:transparent; border-radius:4px; position:relative; margin:0 auto; }
  .phoneme-gauge { width:10px; height:100%; min-height:40px; background:var(--deep); position:relative; margin:6px auto; border:1px solid rgba(255,255,255,0.04); }
  .phoneme-gauge .fill { position:absolute; bottom:0; left:0; width:100%; height:0%; min-height:4px; background:transparent; transition:height 150ms linear, background-color 150ms, opacity 120ms; }
  .phoneme-gauge.empty { opacity:1; }
  .phoneme-gauge .fill.blink { animation: blink 0.16s linear 6; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }
  /* horizontal detour ratio bar above table (sticky so it's always visible) */
    /* detour ratio area: reserve fixed height so showing/hiding text doesn't shift the table
      Layout requested: video -> 6px -> bar+text -> 6px -> table
    */
    .player-wrap { flex-shrink: 0; background: #000; width: 75%; max-width: 1100px; margin: 0 auto 4px; aspect-ratio: 16/9; }

    /* detour bar: match table width and keep text inside same container */
    #detour-ratio-wrap { width:calc(100% - 32px); max-width:calc(900px - 32px); height:28px; padding:0 12px; background:transparent; box-sizing:border-box; position:sticky; top:4px; z-index:60; margin:0 auto 18px; display:flex; align-items:center; gap:8px; overflow:visible; }
    #detour-ratio-bg { flex:1; height:10px; background: var(--panel-bg); border-radius:6px; overflow:hidden; }
    #detour-ratio-bar { height:100%; width:0%; background: linear-gradient(90deg,var(--accent),var(--success)); transition:width 200ms ease; }
    #detour-progress-text { font-size:.85rem; color:var(--muted); margin-left:8px; white-space:nowrap; }
  td.col-detour textarea { width: 100%; background: #0d1f3a; border: 1px solid #2a3a5c; border-radius: 6px; color: #fff; padding: 6px 8px; font-size: .85rem; font-family: inherit; resize: vertical; min-height: 48px; outline: none; transition: border-color .2s; line-height: 1.4; }
  td.col-detour textarea:focus { border-color: #e94560; background: #0f2545; }
  td.col-detour textarea.filled { border-color: #53d769; }
  .char-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: .75rem; color: #fff; }
  #view-progress { display: none; align-items: center; justify-content: center; min-height: 100vh; }
  #view-progress.active { display: flex; }
  .progress-card { background: var(--card-bg); border-radius: 16px; padding: 40px; width: 500px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
  .progress-card h2 { color: var(--accent); margin-bottom: 24px; }
  .progress-bar-bg { width: 100%; height: 10px; background: var(--panel-bg); border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); width: 0%; transition: width .3s; border-radius: 5px; }
  .progress-text { font-size: .85rem; color: #aaa; text-align: center; margin-bottom: 20px; }
  .result { display: none; text-align: center; margin-top: 16px; }
  .result.active { display: block; }
  .result a { display: inline-block; padding: 12px 28px; background: #53d769; color: #111; border-radius: 10px; text-decoration: none; font-weight: 600; transition: .2s; margin-bottom: 12px; }
  .result a:hover { background: #47c05d; }
  .back-link { display: block; text-align: center; color: #888; font-size: .85rem; cursor: pointer; text-decoration: underline; margin-top: 8px; }
  .back-link:hover { color: #eee; }
  .progress-error { color: #e94560; font-size: .85rem; text-align: center; margin-top: 12px; }
  .cc0{background:#8c00c8}.cc1{background:#444}.cc2{background:#005abe}
  .cc3{background:#be4600}.cc4{background:#008200}.cc5{background:#be0032}
  .cc6{background:#646400}.cc7{background:#008c8c}
  /* wider vertical gauge and goal tick */
  td.col-gauge { width: 24px; padding: 6px 8px; }
  .phoneme-gauge { width:18px; height:100%; min-height:40px; background:#071226; position:relative; margin:6px auto; border:1px solid rgba(255,255,255,0.04); }
  .phoneme-gauge .fill { position:absolute; bottom:0; left:0; width:100%; height:0%; min-height:4px; background:transparent; transition:height 150ms linear, background-color 150ms, opacity 120ms; }
  .phoneme-gauge .goal-tick { position:absolute; left:50%; transform:translateX(-50%); width:26px; height:2px; background:rgba(255,255,255,0.12); border-radius:2px; pointer-events:none; }
  /* make tick match gauge width and sit centered */
  .phoneme-gauge .goal-tick { left:0; transform:none; width:100%; height:2px; background:rgba(255,255,255,0.12); }

  /* editor inline progress should visually match general progress and be overlayed above the table */
  #editor-progress { position: fixed; left: 50%; transform: translateX(-50%); width: 500px; max-width: calc(100% - 32px); z-index: 1200; display: none; }
  /* hide the small editor progress bar — prefer using the shared/global progress bar */
  #editor-progress { display: none !important; }
  #editor-progress .progress-bar-bg { height: 10px; border-radius: 5px; }
</style>
</head>
<body>

<!-- VIEW 1 : SELECTION -->
<div id="view-select" class="view active">
<div class="card">
  <h1>Les Ateliers Doublage</h1>
  <div class="field">
    <label for="group-name">Indiquez votre nom de groupe</label>
    <div style="display:flex;gap:8px;align-items:center;">
      <input type="text" id="group-name" class="search-input" style="border-radius:10px;flex:1;min-width:0;"
             placeholder="ex : Paris Groupe 3" autocomplete="off">
      <button type="button" id="reset-filters" class="btn-sm btn-outline" style="width:150px;margin-left:8px;padding:8px 12px;">Annuler les filtres</button>
    </div>
    <div style="margin-top:6px;display:flex;gap:8px;align-items:center;">
      <button id="btn-reload-save" class="btn-sm" style="display:none">Recharger la sauvegarde ?</button>
      <div id="reload-hint" style="color:#666;font-size:.85rem"></div>
    </div>
  </div>

  <div class="field filters-row" style="margin-top:8px;">
    <div class="filter-col" style="width:140px;min-width:140px;">
      <label for="category-select">Catégorie</label>
      <select id="category-select" style="width:100%;padding:10px 12px;border-radius:10px;background:#0f3460;border:1px solid #333;color:#ddd">
        <option value="all">Toutes</option>
      </select>
    </div>
    <div style="flex:1;min-width:180px;margin-left:8px;">
      <label for="video-search">Rechercher une vidéo</label>
      <input type="text" id="video-search" class="search-input" placeholder="Rechercher une vidéo…" autocomplete="off" style="width:100%;padding:8px;border-radius:8px;background:#0f3460;border:1px solid #333;color:#ddd">
    </div>
    <div class="filter-col" style="width:50px;min-width:50px;text-align:center;">
      <label for="filter-nb">Pers</label>
      <select id="filter-nb" style="width:100%;padding:8px;border-radius:8px;background:#0f3460;border:1px solid #333;color:#ddd">
        <option value="all">-</option>
      </select>
    </div>
    <div class="filter-col" style="width:50px;min-width:50px;text-align:center;">
      <label for="filter-f">F</label>
      <select id="filter-f" style="width:100%;padding:8px;border-radius:8px;background:#0f3460;border:1px solid #333;color:#ddd">
        <option value="all">-</option>
      </select>
    </div>
    <div class="filter-col" style="width:50px;min-width:50px;text-align:center;">
      <label for="filter-h">H</label>
      <select id="filter-h" style="width:100%;padding:8px;border-radius:8px;background:#0f3460;border:1px solid #333;color:#ddd">
        <option value="all">-</option>
      </select>
    </div>
  </div>

  <div class="field">
    <div id="video-list" class="video-list">Chargement…</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
      <div class="file-name" id="video-selected"></div>
      <button type="button" class="refresh-btn" id="refresh-btn">&#8635; Actualiser la liste</button>
    </div>
  </div>
  
  <div class="field">
    <div id="script-preloaded" style="display:none;margin-bottom:8px;"></div>
    <label class="file-input" id="script-label">
      Je pr&eacute;f&egrave;re envoyer mon script
      <input type="file" id="script" accept=".xlsx,.xls,.ods,.csv,.tsv,.txt" hidden>
    </label>
  </div>
  <button id="btn-load-script" disabled>Charger le script &#8594;</button>
  <div class="error" id="select-error"></div>
</div>
</div>

<!-- VIEW 2 : EDITOR -->
<div id="view-editor" class="view">
  <!-- barre fixe en haut -->
  <div class="editor-top">
    <div class="editor-header">
      <button type="button" class="btn-sm btn-outline" id="btn-back">&#8592; Retour</button>
      <h2 id="editor-title">Script</h2>
      <span class="save-status" id="save-status"></span>
    </div>
    <div class="editor-meta"></div>
    <div class="error" id="editor-error" style="margin-bottom:8px"></div>
  </div>

  <!-- player pleine largeur -->
  <div class="player-wrap">
    <video id="editor-video" controls controlsList="nodownload" preload="metadata" playsinline></video>
  </div>
  <div class="player-bar" style="justify-content:center;">
    <div style="display:flex;gap:8px;">
      <!-- autosave enabled: save button removed -->
    </div>
  </div>

  <!-- tableau scrollable -->
  <div class="editor-body">
    <div class="table-col">
      <!-- detour ratio bar (shows % of detours filled; also reused as generation progress) -->
      <div id="detour-ratio-wrap" aria-hidden="true">
        <div id="detour-ratio-bg"><div id="detour-ratio-bar"></div></div>
      </div>
      <div class="table-wrap">
            <table>
          <tbody id="editor-tbody"></tbody>
        </table>
        <div style="margin-top:10px;display:flex;justify-content:center;gap:8px;align-items:center;padding:8px;">
          <div style="display:flex;gap:8px;align-items:center;width:100%;justify-content:center;flex-wrap:wrap;">
            <button type="button" class="btn-sm btn-green" id="btn-generate-2" style="flex:1;min-width:200px;max-width:380px;">G&#233;n&#233;rer la vid&#233;o</button>
            <button type="button" class="btn-sm btn-outline" id="btn-generate-detx" style="flex:1;min-width:200px;max-width:280px;" title="G&#233;n&#233;rer un fichier DetX pour Joker / Cappella">G&#233;n&#233;rer la rythmo seule</button>
          </div>
        </div>
      </div>
      <!-- editor inline progress overlay (used during generation) -->
      <div id="editor-progress" role="status" aria-live="polite">
        <div class="progress-bar-bg"><div class="progress-bar" id="editor-progress-bar" style="width:0%"></div></div>
        <div class="progress-text" id="editor-progress-text">Préparation…</div>
        <div id="editor-download" style="display:none;text-align:center;margin-top:8px;"></div>
      </div>
    </div>

<!-- VIEW 3 : PROGRESS -->
<div id="view-progress" class="view">
<div class="progress-card">
  <h2>G&#233;n&#233;ration en cours&#8230;</h2>
  <div class="progress-bar-bg"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="progress-text" id="progress-text">Pr&#233;paration&#8230;</div>
  <div class="result" id="result">
    <span class="back-link" id="back-to-editor">&#8592; Retourner &#224; l&#8217;&#233;diteur</span>
  </div>
  <div class="progress-error" id="progress-error"></div>
</div>
</div>

<!-- admin view removed: admin is now a separate page (admin.html) protected by token -->

<script>
var allVideos=[], selectedVideoName='', selectedScriptName='', sessionId='', sessionRows=[], autoSaveTimer=null, sessionPollId=null;

// Admin entry: triple-click title to request a short token and open admin.html
var titleEl=document.querySelector('h1');
if(titleEl){
  var clickCount=0, clickTimer=null;
  titleEl.addEventListener('click',function(){
    clickCount++;
    if(clickTimer)clearTimeout(clickTimer);
    clickTimer=setTimeout(function(){clickCount=0;},700);
    if(clickCount>=3){ clickCount=0; clearTimeout(clickTimer);
      showAdminPrompt('Code admin (4 chiffres)').then(function(code){
        if(!code) return;
        fetch('/admin/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})})
          .then(function(r){ if(r.status===200) return r.json(); throw new Error('Accès refusé'); })
          .then(function(data){ if(data && data.token){ window.location = '/admin.html?token='+encodeURIComponent(data.token); } else { alert('Code incorrect'); } })
          .catch(function(){ alert('Code incorrect ou erreur serveur'); });
      });
    }
  });
}

// Also allow triple-click on the editor excerpt title to open admin (convenience)
var editorTitleEl = document.getElementById('editor-title');
if(editorTitleEl){
  var eClickCount=0, eClickTimer=null;
  editorTitleEl.style.cursor = 'pointer';
  editorTitleEl.title = 'Triple-cliquez pour ouvrir l\'admin';
  editorTitleEl.addEventListener('click', function(){
    eClickCount++;
    if(eClickTimer) clearTimeout(eClickTimer);
    eClickTimer = setTimeout(function(){ eClickCount = 0; }, 700);
    if(eClickCount >= 3){ eClickCount = 0; clearTimeout(eClickTimer);
      showAdminPrompt('Code admin (4 chiffres)').then(function(code){ if(!code) return; fetch('/admin/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code})}).then(function(r){ if(r.status===200) return r.json(); throw new Error('Accès refusé'); }).then(function(data){ if(data && data.token){ window.location = '/admin.html?token='+encodeURIComponent(data.token); } else { alert('Code incorrect'); } }).catch(function(){ alert('Code incorrect ou erreur serveur'); }); });
    }
  });
}

// showAdminPrompt: create a modal password input and return a Promise resolved with the entered value or null
function showAdminPrompt(promptText){
  return new Promise(function(resolve){
    // create overlay
    var overlay = document.createElement('div'); overlay.style.position='fixed'; overlay.style.left=0; overlay.style.top=0; overlay.style.right=0; overlay.style.bottom=0; overlay.style.background='rgba(0,0,0,0.6)'; overlay.style.display='flex'; overlay.style.alignItems='center'; overlay.style.justifyContent='center'; overlay.style.zIndex=9999;
    var card = document.createElement('div'); card.style.background='#071029'; card.style.padding='16px'; card.style.borderRadius='8px'; card.style.width='320px'; card.style.boxSizing='border-box';
    var label = document.createElement('div'); label.textContent = promptText; label.style.marginBottom='8px'; label.style.color='#e6eef8';
    var input = document.createElement('input'); input.type='password'; input.style.width='100%'; input.style.padding='8px'; input.style.borderRadius='6px'; input.style.border='1px solid #334155'; input.style.background='#0b1220'; input.style.color='#e6eef8'; input.autocomplete='off';
    var btnWrap = document.createElement('div'); btnWrap.style.display='flex'; btnWrap.style.justifyContent='flex-end'; btnWrap.style.gap='8px'; btnWrap.style.marginTop='12px';
    var btnCancel = document.createElement('button'); btnCancel.textContent='Annuler'; btnCancel.style.padding='8px 12px'; btnCancel.onclick = function(){ document.body.removeChild(overlay); resolve(null); };
    var btnOk = document.createElement('button'); btnOk.textContent='OK'; btnOk.style.padding='8px 12px'; btnOk.onclick = function(){ var v = input.value; document.body.removeChild(overlay); resolve(v); };
    btnWrap.appendChild(btnCancel); btnWrap.appendChild(btnOk);
    card.appendChild(label); card.appendChild(input); card.appendChild(btnWrap); overlay.appendChild(card); document.body.appendChild(overlay);

// repartition data map: key = normalized title + '|' + excerpt -> row data

var hSet = new Set();

function normalizeKey(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

function loadRepartitionCSV(){
  fetch('/repartition.csv').then(function(r){ if(!r.ok) throw new Error('not ok'); return r.text(); })
  .then(function(txt){
    // reset maps/sets
    repartitionMap = {};
    categoriesSet = new Set(); nbSet = new Set(); fSet = new Set(); hSet = new Set();
    var lines = txt.split(/\r?\n/).filter(function(l){ return l.trim().length>0; });
    if(lines.length<1) return;
    var hdr = lines[0].split(',').map(function(h){return h.trim();});
    var idxFile = hdr.findIndex(function(h){return /fichier|file|video/i.test(h);});
    var idxTitle = hdr.findIndex(function(h){return /titre|nom|film/i.test(h);});
    var idxEx = hdr.findIndex(function(h){return /extrait|num/i.test(h);});
    var idxNb = hdr.findIndex(function(h){return /nombre.*pers/i.test(h) || /nombre/i.test(h);});
    var idxF = hdr.findIndex(function(h){return /^f$/i.test(h) || /fem/i.test(h);});
    var idxH = hdr.findIndex(function(h){return /^h$/i.test(h) || /hom/i.test(h);});
    var idxCat = hdr.findIndex(function(h){return /cat/i.test(h);});
    var idxSpeed = hdr.findIndex(function(h){return /^speed$/i.test(h);});
    var idxAfficher = hdr.findIndex(function(h){return /affich/i.test(h) || /^afficher$/i.test(h);});
    function normalizeNumStr(s){
      if(s===undefined||s===null) return '';
      var t = String(s||'').trim();
      if(!t) return '';
      // accept comma as decimal separator, normalize to dot for Number parsing
      t = t.replace(/,/g, '.');
      var n = Number(t);
      if(isNaN(n)){
        // fallback: remove stray commas and return raw
        return String(s).replace(/,/g,'').trim();
      }
      // if integer, return integer string; else remove trailing .0
      if(Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
      return String(n).replace(/\.0+$/,'');
    }

    lines.slice(1).forEach(function(line){
      var cols = line.split(',');
      var title = '';
      var ex = '';
      if(idxFile>=0){
        var fn = (cols[idxFile]||'').trim();
        if(fn){
          var parsed = parseVideoName(fn);
          title = parsed.title || '';
          ex = parsed.excerpt || '';
        }
      }
      // fallback to explicit title/extract columns if present
      if(!title && idxTitle>=0) title = (cols[idxTitle]||'').trim();
      if(!ex && idxEx>=0) ex = (cols[idxEx]||'').trim();
      var nb = (idxNb>=0? (cols[idxNb]||'').trim() : '');
      var f = (idxF>=0? (cols[idxF]||'').trim() : '');
      var h = (idxH>=0? (cols[idxH]||'').trim() : '');
      var cat = (idxCat>=0? (cols[idxCat]||'').trim() : '');
      // normalize numeric strings: remove "," and trailing .0
      nb = normalizeNumStr(nb);
      f = normalizeNumStr(f);
      h = normalizeNumStr(h);
      var afficher = (idxAfficher>=0? (cols[idxAfficher]||'').trim() : '');
      var speedRaw = (idxSpeed>=0? (cols[idxSpeed]||'').trim() : '');
      var speed = speedRaw ? parseInt(speedRaw, 10) : null;
      if(!isFinite(speed)) speed = null;
      var key = normalizeKey(title) + '|' + (ex||'');
      repartitionMap[key] = {title:title, extract:ex, nb:nb, f:f, h:h, cat:cat, afficher: afficher, speed: speed};
      if(cat) categoriesSet.add(cat);
      if(nb) nbSet.add(nb);
      if(f) fSet.add(f);
      if(h) hSet.add(h);
    });
    // determine whether any rows explicitly set the Afficher column
    repartitionAfficherMode = Object.keys(repartitionMap).some(function(k){ var v = repartitionMap[k]; return v && v.afficher && String(v.afficher).trim().length>0; });
    // reset select contents (keep default option)
    if(categorySelect){ categorySelect.innerHTML = '<option value="all">Toutes</option>'; }
    if(filterNb){ filterNb.innerHTML = '<option value="all">-</option>'; }
    if(filterF){ filterF.innerHTML = '<option value="all">-</option>'; }
    if(filterH){ filterH.innerHTML = '<option value="all">-</option>'; }
    // populate category select
    Array.from(categoriesSet).sort().forEach(function(c){
      var opt = document.createElement('option'); opt.value=c; opt.textContent=c; categorySelect.appendChild(opt);
    });
    Array.from(nbSet).map(function(x){return isNaN(Number(x))?x:String(Number(x));}).map(Number).filter(function(n){return !isNaN(n);}).sort(function(a,b){return a-b}).forEach(function(n){var o=document.createElement('option');o.value=n; o.textContent=n; filterNb.appendChild(o);});
    Array.from(fSet).map(function(x){return isNaN(Number(x))?x:String(Number(x));}).map(Number).filter(function(n){return !isNaN(n);}).sort(function(a,b){return a-b}).forEach(function(n){var o=document.createElement('option');o.value=n; o.textContent=n; filterF.appendChild(o);});
    Array.from(hSet).map(function(x){return isNaN(Number(x))?x:String(Number(x));}).map(Number).filter(function(n){return !isNaN(n);}).sort(function(a,b){return a-b}).forEach(function(n){var o=document.createElement('option');o.value=n; o.textContent=n; filterH.appendChild(o);});
    // re-render video list now that repartition data and selects are ready
    try{ renderVideoList(allVideos); }catch(e){}
    // apply speed to #scroll-per-frame if a video is already selected (restore case)
    applySpeedFromRepartition();
  }).catch(function(){ /* ignore */ });
}

function getRepForVideo(v){ var key = normalizeKey(v._parsedTitle || v.name) + '|' + (v._parsedExcerpt || ''); return repartitionMap[key] || null; }

function applySpeedFromRepartition(){

    if(!selectedVideoName) return;

}

function getFilteredVideosExcluding(exclude){
  var q = (videoSearch && videoSearch.value) ? videoSearch.value.toLowerCase().trim() : '';
  return allVideos.filter(function(v){

    var rep = getRepForVideo(v);
    if(exclude !== 'category'){
      var cs = (categorySelect && categorySelect.value) || 'all'; if(cs !== 'all' && (!rep || rep.cat !== cs)) return false;
    }
    if(exclude !== 'nb'){
      var fn = (filterNb && filterNb.value) || 'all'; if(fn !== 'all' && (!rep || String(rep.nb) !== String(fn))) return false;
    }
    if(exclude !== 'f'){
      var ff = (filterF && filterF.value) || 'all'; if(ff !== 'all' && (!rep || String(rep.f) !== String(ff))) return false;
    }
    if(exclude !== 'h'){
      var fh = (filterH && filterH.value) || 'all'; if(fh !== 'all' && (!rep || String(rep.h) !== String(fh))) return false;
    }
    return true;
  });
}

function setSelectOptions(selectEl, values, defaultLabel, isNumeric){
  if(!selectEl) return;
  var prev = selectEl.value;
  selectEl.innerHTML = '';

  if(!values || !values.length) { selectEl.value = 'all'; return; }
  if(isNumeric){
    values = values.map(function(x){ return Number(x); }).filter(function(n){ return !isNaN(n); }).sort(function(a,b){return a-b;});
  } else {
    values = Array.from(new Set(values)).sort();
  }
  values.forEach(function(v){ var o = document.createElement('option'); o.value = String(v); o.textContent = String(v); selectEl.appendChild(o); });
  try{ if(prev && Array.from(selectEl.options).some(function(o){return o.value===prev;})) selectEl.value = prev; else selectEl.value = 'all'; }catch(e){ selectEl.value='all'; }
}

function updateFilterOptions(){
  var vidsForCat = getFilteredVideosExcluding('category');
  var cats = Array.from(new Set(vidsForCat.map(function(v){ var r = getRepForVideo(v); return r && r.cat ? r.cat : ''; }).filter(Boolean)));

  var vidsForF = getFilteredVideosExcluding('f');

// Parse a filename like "NomDuFilm_Extrait01.mp4" -> {title: 'Nom Du Film', excerpt: '1'}
function parseVideoName(name){
  var base = String(name||'').replace(/\.[^.]+$/, '');
  var m = base.match(/^(.*?)[ _-]*[Ee]xtrait[_ -]*0*(\d+)\b/);
  var titleRaw = base;
  var excerpt = null;
  if(m){ titleRaw = m[1]||base; excerpt = String(parseInt(m[2],10)); }
  // replace underscores/dashes with spaces
  var t = titleRaw.replace(/[_\-]+/g,' ');
  // insert spaces before camelCase capitals
  t = t.replace(/([a-z])([A-Z])/g,'$1 $2');
  // insert space between letters and trailing digits (e.g. "Futur2" -> "Futur 2")
  t = t.replace(/([A-Za-zÀ-ÖØ-öø-ÿ])(\d+)/g, '$1 $2');
  // also insert space when digits are followed by letters (unlikely but helpful)
  t = t.replace(/(\d+)([A-Za-zÀ-ÖØ-öø-ÿ])/g, '$1 $2');
  // collapse multiple spaces
  t = t.replace(/\s+/g,' ').trim();
  // capitalize words
  t = t.split(' ').map(function(w){ return w.charAt(0).toUpperCase()+w.slice(1); }).join(' ');
  return { title: t||base, excerpt: excerpt };
}

function renderVideoList(videos){
  videoListEl.innerHTML='';
  if(!videos.length){ videoListEl.textContent='Aucune vidéo avec script'; return; }
  videos.forEach(function(v){
    var row = document.createElement('div');
    row.className = 'video-row';
    row.dataset.name = v.name;
    row.title = v.name;
    var titleEl = document.createElement('div'); titleEl.className='title'; titleEl.textContent = v._parsedTitle || v.name;
    var exEl = document.createElement('div'); exEl.className='excerpt'; exEl.textContent = v._parsedExcerpt?('Extrait '+v._parsedExcerpt):'';
    // lookup repartition info
    var key = normalizeKey(v._parsedTitle || v.name) + '|' + (v._parsedExcerpt||'');
    var rep = repartitionMap[key] || null;
    var cat = rep && rep.cat? rep.cat : '';
    var nb = rep && rep.nb? rep.nb : '';
    var f = rep && rep.f? rep.f : '';
    var h = rep && rep.h? rep.h : '';
    var repStr = '';
    // normalize repartition display: 'xF/yH' when both present, else 'xF' or 'yH'
    if(f && h) repStr = String(f) + 'F/' + String(h) + 'H';
    else if(f) repStr = String(f) + 'F';
    else if(h) repStr = String(h) + 'H';
    // apply filters
    var cs = categorySelect.value || 'all';
    if(cs !== 'all' && cs !== cat) return;
    var fn = filterNb.value || 'all'; if(fn !== 'all' && String(nb) !== String(fn)) return;
    var ff = filterF.value || 'all'; if(ff !== 'all' && String(f) !== String(ff)) return;
    var fh = filterH.value || 'all'; if(fh !== 'all' && String(h) !== String(fh)) return;

    // If repartition CSV contains some non-empty `Afficher` values, only show those rows.
    if(repartitionAfficherMode){ if(!(rep && rep.afficher && String(rep.afficher).trim().length>0)) return; }

    // use a CSS grid so columns remain tabular regardless of title length
    var infoWrap = document.createElement('div');
    infoWrap.style.display = 'grid';
    // five columns: category | TITLE (large) | Extrait | pers | F/H
    infoWrap.style.gridTemplateColumns = '140px 1.4fr 110px 90px 64px';
    infoWrap.style.alignItems = 'center';
    infoWrap.style.gap = '8px';

    var catEl = document.createElement('div'); catEl.style.color='#aaa'; catEl.style.minWidth='120px'; catEl.textContent = cat?cat:'';
    // ensure title truncates inside grid cell
    titleEl.style.minWidth = '0'; titleEl.style.overflow = 'hidden'; titleEl.style.textOverflow = 'ellipsis'; titleEl.style.whiteSpace = 'nowrap';
    var nbEl = document.createElement('div'); nbEl.style.color='#aaa'; nbEl.style.width='100px'; nbEl.style.textAlign='center'; nbEl.textContent = nb?(nb+' pers.'):'';
    var exEl = exEl || exEl; // keep reference
    exEl.style.textAlign = 'left'; exEl.style.justifySelf = 'start'; exEl.style.paddingLeft = '6px';
    var repEl = document.createElement('div'); repEl.style.color='#aaa'; repEl.style.minWidth='64px'; repEl.style.width='64px'; repEl.style.fontFamily='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace'; repEl.style.textAlign='center'; repEl.textContent = repStr||'';

    infoWrap.appendChild(catEl);
    infoWrap.appendChild(titleEl);
    infoWrap.appendChild(exEl);
    infoWrap.appendChild(nbEl);
    infoWrap.appendChild(repEl);
    row.appendChild(infoWrap);
    if(v.name===selectedVideoName) row.classList.add('selected');
    videoListEl.appendChild(row);
  });
  // adjust video list height to show 14 rows before scrollbar
  try{ adjustVideoListHeight(); }catch(e){}
}

// ensure the video list can show 14 rows before showing scrollbar
function adjustVideoListHeight(){
  if(!videoListEl) return;

    try{ var r = rows[0].getBoundingClientRect(); if(r && r.height) rowH = Math.round(r.height); }catch(e){}
  }
  var target = rowH * 14;
  videoListEl.style.maxHeight = target + 'px';
}

btnLoadScript.addEventListener('click',function(){
  selectError.classList.remove('active');
  btnLoadScript.disabled=true;btnLoadScript.textContent='Analyse…';
  var fd=new FormData();
  if(scriptInput.files.length)fd.append('script',scriptInput.files[0]);
  else fd.append('script_name',selectedScriptName);
  // include group name so server session file records the group
  if(groupNameInput && groupNameInput.value && groupNameInput.value.trim()) fd.append('group_name', groupNameInput.value.trim());

// Convert TC string (HH:MM:SS:FF or HH:MM:SS or MM:SS) to seconds
function tcToSeconds(tc){
  if(!tc)return 0;
  var parts=String(tc).trim().split(/[:.;]/);
  if(parts.length>=4){// HH:MM:SS:FF — ignore frames (assume ~25fps)
    return (+parts[0])*3600+(+parts[1])*60+(+parts[2])+(+parts[3])/25;
  } else if(parts.length===3){
    return (+parts[0])*3600+(+parts[1])*60+(+parts[2]);
  } else if(parts.length===2){
    return (+parts[0])*60+(+parts[1]);
  }
  return parseFloat(tc)||0;
}

// Format current time as HH:MM:SS
function fmtTime(s){
  s=Math.floor(s||0);
  var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

// --- phoneme gauge helpers ---
var phonemizeTimers = {};
function debouncePhonemize(idx, text){
  if(phonemizeTimers[idx]) clearTimeout(phonemizeTimers[idx]);
  phonemizeTimers[idx] = setTimeout(function(){ doPhonemize(idx, text); }, 300);
}

function doPhonemize(idx, text){
  // request phoneme count for detour and compute ratio against orig_phonemes
  var row = sessionRows[idx];
  if(!row) return;
  var orig = row.orig_phonemes || null;
  fetch('/phonemize', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text: text, lang: 'fr'})})
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data && data.phonemes!==undefined){ row.detour_phonemes = data.phonemes; }
      else { row.detour_phonemes = null; }
      updateGauge(idx);
      updateDetourRatioBar();
    }).catch(function(){ row.detour_phonemes = null; updateGauge(idx); updateDetourRatioBar(); });
}

function updateGauge(idx){
  var tr = editorTbody.querySelector('tr:nth-child('+(idx+1)+')');
  if(!tr) return;
  var g = tr.querySelector('.phoneme-gauge .fill');
  if(!g) return;
  var row = sessionRows[idx];
  var orig = row.orig_phonemes || null;
  var det = row.detour_phonemes || 0;
  if(!orig || orig===0){
    // no original phonemes known — show a small neutral indicator so the gauge is visible
    g.style.height = '8%'; g.style.backgroundColor = '#9aa6b2';
    g.classList.remove('blink');
    var pg = tr.querySelector('.phoneme-gauge'); if(pg) pg.classList.add('empty');
    return;
  }
  var pg = tr.querySelector('.phoneme-gauge'); if(pg) pg.classList.remove('empty');
  // compute percent and display cap at 120%
  var pct = orig>0 ? Math.round((det / orig) * 100) : 0;
  var displayPct = Math.max(0, Math.min(120, pct));
  g.style.height = displayPct+'%';
  // simple color rules (only red/orange/green):
  // red if <50% or >120%, green if close to 100% (90-110), orange otherwise
  var color = '#f2994a';
  if(pct < 50 || pct > 120) color = '#e94560';
  else if(pct >= 90 && pct <= 110) color = '#53d769';
  g.style.backgroundColor = color;
  // blink only when the computed percent is exactly 100% (target achieved)
  if(pct === 100){ g.classList.remove('blink'); void g.offsetWidth; g.classList.add('blink'); }
  else { g.classList.remove('blink'); }
  // update debug info display
  try{
    // ensure a goal tick is present at the 100% mark (100% corresponds to 83.333% of full height)
    var pg = tr.querySelector('.phoneme-gauge');
    if(pg){
      var tick = pg.querySelector('.goal-tick');
      if(!tick){ tick = document.createElement('div'); tick.className='goal-tick'; pg.appendChild(tick); }
      // bottom position for 100% target on a 120%-scaled gauge = 100/120 * 100
      tick.style.bottom = '83.333%';
    }
  }catch(e){}
  // end updateGauge
}

function updateDetourRatioBar(){
  try{
    var total = sessionRows.length || 0;
    if(!total){ document.getElementById('detour-ratio-bar').style.width='0%'; pushLiveProgress(); return; }
    var filled = sessionRows.filter(function(r){ return r.detour && r.detour.trim()!==''; }).length;
    var pct = Math.round((filled/total)*100);
    document.getElementById('detour-ratio-bar').style.width = pct+'%';
    // color scale between gray and green
    var bar = document.getElementById('detour-ratio-bar');
    bar.style.background = (pct>0? 'linear-gradient(90deg,#e94560,#53d769)' : '#6b7280');
  }catch(e){}
  pushLiveProgress();
}

// push live progress to the server so the monitoring dashboard reflects gauge
// changes immediately instead of waiting for the periodic autosave.
var livePushTimer=null;
function pushLiveProgress(){
  if(!sessionId) return;
  clearTimeout(livePushTimer);
  livePushTimer=setTimeout(function(){
    var total=sessionRows.length||0, translated=0, qualitySum=0, qualityCount=0;
    sessionRows.forEach(function(r){
      if(!r.detour || !r.detour.trim())return;
      translated++;
      var orig=r.orig_phonemes||0;
      if(orig && r.detour_phonemes!=null){
        var ratio=(r.detour_phonemes/orig)*100;
        qualitySum += Math.max(0,100-Math.abs(ratio-100));
        qualityCount++;
      }
    });
    var payload={
      rows_total: total,
      rows_translated: translated,
      progress_pct: total? Math.round((translated/total)*100) : 0,
      quality_pct: qualityCount? Math.round(qualitySum/qualityCount) : null
    };
    fetch('/live/'+encodeURIComponent(sessionId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(function(){});
  },500);
}

// Ensure the highlighted row is visible in the table-wrap. If it's the 4th
// visible row or below, scroll so it sits at the 4th line (index 3) from top.
function ensureRowVisible(rowEl){
  var container = document.querySelector('.table-wrap');
  if(!container || !rowEl) return;
  // compute list of visible rows
  var rows = Array.from(editorTbody.querySelectorAll('tr'));
  if(!rows.length) return;
  var firstVisible = null;
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    var rect = r.getBoundingClientRect();
    var crect = container.getBoundingClientRect();
    if(rect.bottom > crect.top + 2){ firstVisible = i; break; }
  }
  if(firstVisible===null) firstVisible = 0;
  var idx = rows.indexOf(rowEl);
  if(idx<0) return;
  var visibleIndex = idx - firstVisible;
  // if highlighted row is the 4th visible (index 3) or beyond, scroll
  if(visibleIndex >= 2){
    var rowHeight = rowEl.getBoundingClientRect().height || 24;
    var targetScroll = Math.max(0, rowEl.offsetTop - rowHeight * 2);
    // animate a little for smoothness
    container.scrollTo({ top: targetScroll, behavior: 'smooth' });
  }
}

        if(editorPbar) editorPbar.style.width='0%';
        if(editorPtxt) editorPtxt.textContent='Préparation…';
        if(editorProg) editorProg.style.display='none';
        var edDownload=document.getElementById('editor-download'); if(edDownload) edDownload.style.display='none';
      }catch(e){}
      try{ restoreSharedProgressToView(); }catch(e){}
      try{ restoreDetourBar(); }catch(e){}
      if(btn){ btn.disabled=false; btn.textContent='Générer la vidéo'; }
    });
}

var btnGen=document.getElementById('btn-generate'); if(btnGen) btnGen.addEventListener('click',doGenerate);
var btnGen2=document.getElementById('btn-generate-2'); if(btnGen2) btnGen2.addEventListener('click',doGenerate);
var btnGenDetx=document.getElementById('btn-generate-detx'); if(btnGenDetx) btnGenDetx.addEventListener('click',doGenerateDetX);

// position the editor progress overlay relative to the table-wrap (global)
function positionEditorProgress(){
  try{
    var tableWrap = document.querySelector('.table-wrap');
    var editorProg = document.getElementById('editor-progress');
    if(!tableWrap || !editorProg) return;
    var rect = tableWrap.getBoundingClientRect();
    var epH = editorProg.offsetHeight || 56;
    var desiredTop = rect.top + window.scrollY - epH - 8;
    if(desiredTop < 8) desiredTop = rect.top + window.scrollY + 8;
    editorProg.style.position = 'fixed';
    editorProg.style.top = desiredTop + 'px';
    var w = Math.min(500, Math.max(220, Math.round(rect.width - 32)));
    editorProg.style.width = w + 'px';
  }catch(e){}
}
window.addEventListener('resize', positionEditorProgress);
window.addEventListener('scroll', positionEditorProgress);

// --- shared progress card mount/unmount ---
var _sharedProgress = document.querySelector('#view-progress .progress-card');
var _sharedProgressOriginalParent = _sharedProgress ? _sharedProgress.parentNode : null;
var _sharedProgressOriginalNext = _sharedProgress ? _sharedProgress.nextSibling : null;
function mountSharedProgressIntoEditor(){
  try{
    if(!_sharedProgress) _sharedProgress = document.querySelector('#view-progress .progress-card');
    var editorProg = document.getElementById('editor-progress');
    if(!_sharedProgress || !editorProg) return;
    if(editorProg.contains(_sharedProgress)) return; // already mounted
    // append shared progress card into editor-progress, but hide header/result so only the bar/text remain
    editorProg.appendChild(_sharedProgress);
    var vp = document.getElementById('view-progress'); if(vp) vp.style.display='none';
    // hide the title and result sections inside the shared card to avoid the large panel appearance
    try{
      var h2 = _sharedProgress.querySelector('h2'); if(h2) h2.style.display='none';
      var res = _sharedProgress.querySelector('.result'); if(res) res.style.display='none';
      var perr = _sharedProgress.querySelector('.progress-error'); if(perr) perr.style.display='none';
      _sharedProgress.style.padding = '6px 12px';
    }catch(e){}
    editorProg.style.display='block';
    positionEditorProgress();
  }catch(e){}
}
function restoreSharedProgressToView(){
  try{
    if(!_sharedProgress) return;
    var editorProg = document.getElementById('editor-progress');
    if(editorProg && editorProg.contains(_sharedProgress)){
      // put back to original parent
      if(_sharedProgressOriginalParent){
        if(_sharedProgressOriginalNext && _sharedProgressOriginalNext.parentNode===_sharedProgressOriginalParent){
          _sharedProgressOriginalParent.insertBefore(_sharedProgress, _sharedProgressOriginalNext);
        } else {
          _sharedProgressOriginalParent.appendChild(_sharedProgress);
        }
      }
      // restore visibility of hidden parts
      try{ var h2 = _sharedProgress.querySelector('h2'); if(h2) h2.style.display='block'; var res = _sharedProgress.querySelector('.result'); if(res) res.style.display='block'; var perr = _sharedProgress.querySelector('.progress-error'); if(perr) perr.style.display='block'; _sharedProgress.style.padding='40px'; }catch(e){}
      editorProg.style.display='none';
      var vp = document.getElementById('view-progress'); if(vp) vp.style.display='block';
    }
  }catch(e){}
}

// --- detour bar as generation progress helpers ---
function useDetourBarForGeneration(){
  try{
    var detbar = document.getElementById('detour-ratio-bar');
    var detwrap = document.getElementById('detour-ratio-wrap');
    if(!detbar || !detwrap) return;
    if(_detourGen.active) return;
    _detourGen.prevWidth = detbar.style.width || window.getComputedStyle(detbar).width;
    _detourGen.prevBg = detbar.style.background || window.getComputedStyle(detbar).background;
    // create or show a small text element inside wrap
    var txt = document.getElementById('detour-progress-text');
    if(!txt){ txt = document.createElement('div'); txt.id='detour-progress-text'; txt.style.fontSize='.85rem'; txt.style.color='#aaa'; detwrap.appendChild(txt); }
    txt.textContent = 'Envoi…';
    _detourGen.textEl = txt;
    // reset bar
    detbar.style.transition = 'width 200ms ease';
    detbar.style.width = '0%';
    detbar.style.background = 'linear-gradient(90deg,#e94560,#53d769)';
    _detourGen.active = true;
  }catch(e){}
}

function restoreDetourBar(){
  try{
    if(!_detourGen.active) return;
    var detbar = document.getElementById('detour-ratio-bar');
    if(detbar && _detourGen.prevWidth) detbar.style.width = _detourGen.prevWidth;
    if(detbar && _detourGen.prevBg) detbar.style.background = _detourGen.prevBg;
    if(_detourGen.textEl){ try{ _detourGen.textEl.parentNode && _detourGen.textEl.parentNode.removeChild(_detourGen.textEl); }catch(e){} }
    _detourGen.active = false; _detourGen.prevWidth = null; _detourGen.prevBg = null; _detourGen.textEl = null;
  }catch(e){}
}

var PHASES={upload:'Envoi…',read:'Lecture du script…',strips:'Pré-rendu des bandes…',video:'Ouverture vidéo…',render:'Rendu en cours…',done:'Terminé !'};

function trackProgress(jobId){
  var epbar=document.getElementById('editor-progress-bar'), eptxt=document.getElementById('editor-progress-text');
  // close previous source if any
  if(currentJobSource){ try{ currentJobSource.close(); }catch(e){} currentJobSource=null; }
  var es=new EventSource('/progress/'+jobId);
  currentJobSource = es;
  es.onmessage=function(evt){
    var info=JSON.parse(evt.data);
    var pct=info.progress||0;
    // update both local editor bar and shared/global bar if present
    if(epbar){ epbar.style.width = pct+'%'; }
    try{ var sharedBar = document.getElementById('progress-bar'); if(sharedBar) sharedBar.style.width = pct+'%'; }catch(e){}
    var lbl = PHASES[info.phase]||info.phase;
    var txt = (info.phase==='render'&&info.total)?(lbl+' '+pct+'% ('+info.frame+'/'+info.total+' frames)'):(lbl+' '+pct+'%');
    if(eptxt){ eptxt.textContent = txt; }
    try{ var sharedTxt = document.getElementById('progress-text'); if(sharedTxt) sharedTxt.textContent = txt; }catch(e){}
    // update detour-ratio bar when in generation mode
    try{
      if(_detourGen.active){
        var detbar = document.getElementById('detour-ratio-bar');
        if(detbar) detbar.style.width = pct + '%';
        var dettxt = document.getElementById('detour-progress-text');
        if(dettxt) dettxt.textContent = txt;
      }
    }catch(e){}
    // if done: load preview into main player and autoplay
    if(info.status==='done'){
      try{ es.close(); }catch(e){}
      currentJobId = null;
      currentJobSource = null;
      if(epbar) epbar.style.width='100%';
      if(eptxt) eptxt.textContent = 'Terminé !';
      try{ var sharedBar = document.getElementById('progress-bar'); if(sharedBar) sharedBar.style.width='100%'; var sharedTxt = document.getElementById('progress-text'); if(sharedTxt) sharedTxt.textContent = 'Terminé !'; }catch(e){}
      // set preview into main video player and autoplay
      try{
        editorVideo.src = '/preview/'+jobId;
        editorVideo.load();
        editorVideo.play().catch(function(){});
      }catch(e){}
      // reset generate button
      try{ var b = document.getElementById('btn-generate-2'); if(b){ try{ b.removeEventListener('click', stopGeneration); }catch(e){} b.removeEventListener('click', doGenerate); b.addEventListener('click', doGenerate); b.disabled=false; b.textContent='Générer la vidéo'; } var gbtn = document.getElementById('btn-generate'); if(gbtn){ try{ gbtn.removeEventListener('click', stopGeneration); }catch(e){} gbtn.removeEventListener('click', doGenerate); gbtn.addEventListener('click', doGenerate); gbtn.disabled=false; gbtn.textContent='Générer la vidéo'; } }catch(e){}
      try{ restoreSharedProgressToView(); }catch(e){}
    }
    else if(info.status==='error'){
      try{ es.close(); }catch(e){}
      currentJobId = null; currentJobSource = null;
      if(eptxt) eptxt.textContent = info.error||'Erreur inconnue';
      try{ var sharedTxt = document.getElementById('progress-text'); if(sharedTxt) sharedTxt.textContent = info.error||'Erreur inconnue'; }catch(e){}
      editorError.textContent = info.error||'Erreur inconnue';
      editorError.classList.add('active');
      try{ [document.getElementById('btn-generate-2'), document.getElementById('btn-generate')].forEach(function(b){ if(b){ b.removeEventListener('click', stopGeneration); b.removeEventListener('click', doGenerate); b.addEventListener('click', doGenerate); b.disabled=false; b.textContent='Générer la vidéo'; } }); }catch(e){}
      try{ restoreSharedProgressToView(); }catch(e){}
      try{ restoreDetourBar(); }catch(e){}
    }
  };
  es.onerror=function(){ try{ es.close(); }catch(e){} currentJobSource=null; if(eptxt) eptxt.textContent='Connexion perdue'; };
}

document.getElementById('back-to-editor').addEventListener('click',function(){showView('view-editor');});
